name: Release Charts
permissions: {}

on:
  push:
    branches:
      - main

jobs:
  release:
    environment: release
    permissions:
      contents: write # to push chart release and create a release (helm/chart-releaser-action)
      packages: write # needed for ghcr access
      id-token: write # needed for keyless signing

    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'

      - name: Fetch history
        run: git fetch --prune --unshallow

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # renovate: github=helm/helm
          version: v4.3.1
      
      - name: GPG configuration
        run: |-
          echo "$GPG_KEY" > "$GPG_KEY_PATH"
          mkdir -p "$HOME/.gnupg"
          chmod 0700 "$HOME/.gnupg"
          echo "use-agent" > "$HOME/.gnupg/gpg.conf"
          echo "pinentry-mode loopback" >> "$HOME/.gnupg/gpg.conf"
          echo "allow-loopback-pinentry" > "$HOME/.gnupg/gpg-agent.conf"
          echo "max-cache-ttl 86400" >> "$HOME/.gnupg/gpg-agent.conf"
          echo "default-cache-ttl 86400" >> "$HOME/.gnupg/gpg-agent.conf"
          gpgconf --kill gpg-agent
          gpgconf --launch gpg-agent
          gpg --batch --yes --passphrase-fd 0 --import "$GPG_KEY_PATH" <<< "$GPG_PASSPHRASE"

          mkdir "${{ runner.temp }}/.gnupg/"
          gpg --batch --yes --export "$GPG_KEY_ID" >~/.gnupg/pubring.gpg
          gpg --batch --yes --passphrase-fd 0 --export-secret-keys "$GPG_KEY_ID" >~/.gnupg/secring.gpg <<< "$GPG_PASSPHRASE"
          cat > "$GPG_PASSPHRASE_FILE" <<< "$GPG_PASSPHRASE"
        env:
          GPG_KEY_ID: "${{ vars.GPG_KEY_ID }}"
          GPG_KEY: "${{ secrets.GPG_PRIVATE_KEY }}"
          GPG_PASSPHRASE: "${{ secrets.GPG_PASSPHRASE }}"
          GPG_PASSPHRASE_FILE: "${{ runner.temp }}/gpg-passphrase"
          GPG_KEY_PATH: "${{ runner.temp }}/private.key"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@df287104677278f869ca5480bd260358397cc3f9 # v1.8.0
        with:
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_GENERATE_RELEASE_NOTES: true
          CR_SIGN: true
          CR_KEY: "${{ vars.GPG_KEY_NAME }}"
          CR_KEYRING: "~/.gnupg/secring.gpg"
          CR_PASSPHRASE_FILE: "${{ runner.temp }}/gpg-passphrase"

      # Generated notes list every PR since the previous tag of the chart, across all charts.
      - name: Limit release notes to the released chart
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          NOTES_FILE: "${{ runner.temp }}/release-notes.md"
        run: |
          shopt -s nullglob
          for pkg in .cr-release-packages/*.tgz; do
            chart="$(helm show chart "${pkg}")"
            name="$(yq -r '.name' <<< "${chart}")"
            tag="${name}-$(yq -r '.version' <<< "${chart}")"

            body="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json body --jq '.body')"
            awk -v chart="${name}" '
              function flush() {
                if (n > 0) { out = out header "\n\n" buf "\n" }
                header = ""; buf = ""; n = 0
              }
              /^## / { flush(); header = $0; section = ($0 == "## New Contributors") ? "contrib" : "changes"; next }
              /^\*\*Full Changelog\*\*/ { flush(); section = ""; out = out $0 "\n"; next }
              section == "changes" && /^\* / {
                if (index($0, "* [" chart "] ") == 1) { buf = buf $0 "\n"; n++; kept[$NF] = 1 }
                next
              }
              section == "contrib" && /^\* / {
                if ($NF in kept) { buf = buf $0 "\n"; n++ }
                next
              }
              section != "" { next }
              { out = out $0 "\n" }
              END { flush(); printf "%s", out }
            ' <<< "${body}" > "${NOTES_FILE}"

            notes="$(< "${NOTES_FILE}")"
            if [[ "${notes}" == "${body}" ]]; then
              echo "Release notes of ${tag} already limited to ${name}"
            else
              gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --notes-file "${NOTES_FILE}"
            fi
          done

      # see https://github.com/helm/chart-releaser/issues/183
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push charts to GHCR
        run: |
          shopt -s nullglob
          for pkg in .cr-release-packages/*.tgz; do
            if [ -z "${pkg:-}" ]; then
              break
            fi
            # chart-releaser packages every chart with changed files, even without a version bump.
            # Never overwrite a published version, so tags keep resolving to the same digest.
            chart="$(helm show chart "${pkg}")"
            name="$(yq -r '.name' <<< "${chart}")"
            version="$(yq -r '.version' <<< "${chart}")"
            ref="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/${name}"

            if output="$(helm show chart "${ref}" --version "${version}" 2>&1)"; then
              echo "Skipping ${name}:${version}, already published"
            # ghcr.io may answer denied instead of not found for charts that were never published.
            elif [[ "${output}" == *": not found"* || "${output}" == *"denied"* ]]; then
              helm push "${pkg}" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
            else
              echo "::error::Failed to check ghcr.io for ${name}:${version}: ${output}"
              exit 1
            fi
          done
