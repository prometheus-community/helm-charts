name: Release Charts
permissions: {}

on:
  push:
    branches:
      - main

jobs:
  release:
    environment: release
    permissions:
      contents: write # to push chart release and create a release (helm/chart-releaser-action)
      packages: write # needed for ghcr access

    runs-on: ubuntu-24.04
    outputs:
      charts: ${{ steps.charts.outputs.charts }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'

      - name: Fetch history
        run: git fetch --prune --unshallow

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          # renovate: github=helm/helm
          version: v4.3.2
      
      - name: GPG configuration
        run: |-
          echo "$GPG_KEY" > "$GPG_KEY_PATH"
          mkdir -p "$HOME/.gnupg"
          chmod 0700 "$HOME/.gnupg"
          echo "use-agent" > "$HOME/.gnupg/gpg.conf"
          echo "pinentry-mode loopback" >> "$HOME/.gnupg/gpg.conf"
          echo "allow-loopback-pinentry" > "$HOME/.gnupg/gpg-agent.conf"
          echo "max-cache-ttl 86400" >> "$HOME/.gnupg/gpg-agent.conf"
          echo "default-cache-ttl 86400" >> "$HOME/.gnupg/gpg-agent.conf"
          gpgconf --kill gpg-agent
          gpgconf --launch gpg-agent
          gpg --batch --yes --passphrase-fd 0 --import "$GPG_KEY_PATH" <<< "$GPG_PASSPHRASE"

          mkdir "${{ runner.temp }}/.gnupg/"
          gpg --batch --yes --export "$GPG_KEY_ID" >~/.gnupg/pubring.gpg
          gpg --batch --yes --passphrase-fd 0 --export-secret-keys "$GPG_KEY_ID" >~/.gnupg/secring.gpg <<< "$GPG_PASSPHRASE"
          cat > "$GPG_PASSPHRASE_FILE" <<< "$GPG_PASSPHRASE"
        env:
          GPG_KEY_ID: "${{ vars.GPG_KEY_ID }}"
          GPG_KEY: "${{ secrets.GPG_PRIVATE_KEY }}"
          GPG_PASSPHRASE: "${{ secrets.GPG_PASSPHRASE }}"
          GPG_PASSPHRASE_FILE: "${{ runner.temp }}/gpg-passphrase"
          GPG_KEY_PATH: "${{ runner.temp }}/private.key"

      - name: Run chart-releaser
        id: cr
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        with:
          # renovate: github=helm/chart-releaser
          version: v1.10.1
          skip_existing: true
          oci_registry_url: "oci://ghcr.io/${{ github.repository_owner }}/charts"
          oci_username: "${{ github.actor }}"
          oci_password: "${{ secrets.GITHUB_TOKEN }}"
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_GENERATE_RELEASE_NOTES: true
          CR_SIGN: true
          CR_KEY: "${{ vars.GPG_KEY_NAME }}"
          CR_KEYRING: "~/.gnupg/secring.gpg"
          CR_PASSPHRASE_FILE: "${{ runner.temp }}/gpg-passphrase"

      - name: List released charts
        id: charts
        shell: bash # pipefail: never drop a chart silently
        run: |
          IFS=',' read -ra dirs <<< "$CHANGED_CHARTS"
          for dir in "${dirs[@]}"; do
            [[ -f "$dir/Chart.yaml" ]] || continue
            yq -o json -I0 '{"name": .name, "version": .version}' "$dir/Chart.yaml"
          done | jq -rs '"charts=\(tojson)"' >> "$GITHUB_OUTPUT"
        env:
          CHANGED_CHARTS: "${{ steps.cr.outputs.changed_charts }}"

      # GitHub generates the release notes from all pull requests merged since
      # the previous release of the chart, including those of other charts.
      # Keep only the entries of the released chart and those for all charts,
      # based on the "[<chart>]" or "[ALL]" prefix of the pull request titles.
      - name: Filter release notes
        if: steps.cr.outputs.changed_charts != ''
        shell: bash
        run: |
          IFS=',' read -ra charts <<< "$CHANGED_CHARTS"
          for chart in "${charts[@]}"; do
            [[ -f "$chart/Chart.yaml" ]] || continue
            name=$(yq -r '.name' "$chart/Chart.yaml")
            release="$name-$(yq -r '.version' "$chart/Chart.yaml")"
            notes="$RUNNER_TEMP/$release.md"
            gh release view "$release" --json body --jq .body \
              | grep -vP "^\* (?!\[(\Q$name\E|ALL)\] )|^## New Contributors$" \
              | cat -s > "$notes"
            gh release edit "$release" --notes-file "$notes"
          done
        env:
          CHANGED_CHARTS: "${{ steps.cr.outputs.changed_charts }}"
          GH_REPO: "${{ github.repository }}"
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  # Separate job so that the OIDC token used for keyless signing never shares
  # a job with the GPG signing key.
  sign:
    name: Sign ${{ matrix.chart.name }}-${{ matrix.chart.version }}
    needs: release
    if: needs.release.outputs.charts != '[]'
    permissions:
      packages: write # push signatures and attestations to ghcr
      id-token: write # keyless signing (Sigstore) and attestations
      attestations: write # GitHub artifact attestations
      artifact-metadata: write # attestation storage records

    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(needs.release.outputs.charts) }}
    env:
      REPOSITORY: "ghcr.io/${{ github.repository_owner }}/charts/${{ matrix.chart.name }}"
    steps:
      - name: Set up cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          # renovate: github=sigstore/cosign
          cosign-release: v3.1.6

      - name: Set up oras
        uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4

      # cosign signs digests, not tags; helm replaces "+" with "_" in OCI tags.
      - name: Resolve digest
        id: digest
        run: |
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
          digest=$(oras resolve "$REPOSITORY:${VERSION//+/_}")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          VERSION: "${{ matrix.chart.version }}"

      - name: Sign
        run: |
          cosign sign --yes "$REPOSITORY@$DIGEST"
          cosign verify "$REPOSITORY@$DIGEST" \
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
        env:
          DIGEST: "${{ steps.digest.outputs.digest }}"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: "${{ env.REPOSITORY }}"
          subject-digest: "${{ steps.digest.outputs.digest }}"
          push-to-registry: true
