suite: container resources
templates:
  - deployment.yaml
  - secret.yaml
  - secret-config.yaml
tests:
  - template: deployment.yaml
    it: keeps exporter resources without Cloud SQL Proxy
    set:
      resources:
        limits:
          cpu: 200m
          memory: 128Mi
        requests:
          cpu: 100m
          memory: 64Mi
      cloudsqlproxy.enabled: false
      cloudsqlproxy.workloadIdentity.enabled: true
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 64Mi
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            valueFrom:
              resourceFieldRef:
                resource: limits.memory
  - template: deployment.yaml
    it: keeps exporter resources with Cloud SQL Proxy
    set:
      resources:
        limits:
          cpu: 200m
          memory: 128Mi
        requests:
          cpu: 100m
          memory: 64Mi
      cloudsqlproxy.enabled: true
      cloudsqlproxy.workloadIdentity.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 64Mi
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            valueFrom:
              resourceFieldRef:
                resource: limits.memory
      - equal:
          path: spec.template.spec.containers[1].resources
          value: {}
  - template: deployment.yaml
    it: keeps separate resources on the exporter and Cloud SQL Proxy
    set:
      resources:
        limits:
          cpu: 200m
          memory: 128Mi
        requests:
          cpu: 100m
          memory: 64Mi
      cloudsqlproxy.enabled: true
      cloudsqlproxy.workloadIdentity.enabled: true
      cloudsqlproxy.resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 250m
          memory: 128Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 64Mi
      - equal:
          path: spec.template.spec.containers[1].resources
          value:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 250m
              memory: 128Mi
  - template: deployment.yaml
    it: keeps proxy resources separate when exporter resources are unset
    set:
      cloudsqlproxy.enabled: true
      cloudsqlproxy.workloadIdentity.enabled: true
      cloudsqlproxy.resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 250m
          memory: 128Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value: {}
      - equal:
          path: spec.template.spec.containers[1].resources
          value:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 250m
              memory: 128Mi
  - template: deployment.yaml
    it: leaves resource limits unset by default
    set:
      cloudsqlproxy.enabled: true
      cloudsqlproxy.workloadIdentity.enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].resources.limits
      - notExists:
          path: spec.template.spec.containers[0].resources.requests
      - notExists:
          path: spec.template.spec.containers[1].resources.limits
      - notExists:
          path: spec.template.spec.containers[1].resources.requests
