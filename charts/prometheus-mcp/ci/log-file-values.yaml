# Exercises log.file on a writable emptyDir, nameOverride, and
# serviceAccount.create=false.

nameOverride: "prometheus-mcp-log-test"

log:
  file: "/tmp/logs/prometheus-mcp.log"

serviceAccount:
  create: false
  name: "default"

extraVolumes:
  - name: log-directory
    emptyDir: {}

extraVolumeMounts:
  - name: log-directory
    mountPath: /tmp/logs
