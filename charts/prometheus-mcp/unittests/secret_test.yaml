# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test http-config secret
templates:
  - secret.yaml
tests:
  - it: should be empty when httpConfig is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should render inline config under the configured secretKey
    set:
      httpConfig:
        enabled: true
        config:
          tls_config:
            insecure_skip_verify: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      # Must match the secretName the Deployment mounts (deployment_test.yaml).
      - equal:
          path: metadata.name
          value: RELEASE-NAME-prometheus-mcp-http-config
      - equal:
          path: data["http-config.yaml"]
          decodeBase64: true
          value: |-
            tls_config:
              insecure_skip_verify: true

  # A block scalar would end at basic_auth, which is indented less than the
  # comment above it.
  - it: should render a string config byte-exact instead of re-encoding it
    set:
      httpConfig:
        enabled: true
        config: "  # comment\nbasic_auth:\n  username: admin\n"
    asserts:
      - equal:
          path: data["http-config.yaml"]
          decodeBase64: true
          value: "  # comment\nbasic_auth:\n  username: admin\n"

  # The httpConfig guards live in a helper rendered by secret.yaml and
  # deployment.yaml; Helm renders secret.yaml first, so failures land here.
  - it: should fail when httpConfig is enabled without config or existingSecret
    set:
      httpConfig.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "httpConfig.enabled is true but neither httpConfig.existingSecret nor httpConfig.config is set"

  - it: should fail when existingSecret and config are both set
    set:
      httpConfig:
        enabled: true
        existingSecret: my-secret
        config:
          tls_config:
            insecure_skip_verify: true
    asserts:
      - failedTemplate:
          errorPattern: "httpConfig.existingSecret and httpConfig.config are mutually exclusive"

  - it: should fail when config is set but httpConfig.enabled is false
    set:
      httpConfig:
        config:
          tls_config:
            insecure_skip_verify: true
    asserts:
      - failedTemplate:
          errorPattern: "httpConfig.enabled is false"

  - it: should fail when secretKey is not a valid Secret data key
    set:
      httpConfig:
        enabled: true
        existingSecret: my-secret
        secretKey: a/b
    asserts:
      - failedTemplate:
          errorPattern: "must be a valid Secret data key"
