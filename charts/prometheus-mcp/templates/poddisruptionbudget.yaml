{{- if .Values.podDisruptionBudget }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "prometheus-mcp.fullname" . }}
  labels:
    {{- include "prometheus-mcp.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "prometheus-mcp.selectorLabels" . | nindent 6 }}
  {{- toYaml .Values.podDisruptionBudget | nindent 2 }}
{{- end }}
