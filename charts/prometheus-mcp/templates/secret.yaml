{{- include "prometheus-mcp.validateHTTPConfig" . -}}
{{- if and .Values.httpConfig.enabled (not .Values.httpConfig.existingSecret) .Values.httpConfig.config }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prometheus-mcp.httpConfigSecretName" . }}
  labels:
    {{- include "prometheus-mcp.labels" . | nindent 4 }}
  {{- with .Values.httpConfig.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- /* A string config is already-rendered YAML (e.g. from --set-file) and is
  stored as-is; re-encoding it with toYaml would corrupt the mounted file,
  which the server fails to load and exits on. Base64 rather than stringData:
  a block scalar misparses a string whose first line is indented deeper than a
  later one. */}}
  {{- $config := .Values.httpConfig.config }}
  {{- if not (kindIs "string" $config) }}
  {{- $config = toYaml $config }}
  {{- end }}
  {{- /* Quoted: the manifest is decoded with YAML 1.1 rules before it reaches
  the API server, which would turn a key such as "on" into "true". */}}
  {{ .Values.httpConfig.secretKey | quote }}: {{ $config | b64enc }}
{{- end }}
