# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test additionalPodMonitors
templates:
  - prometheus/podmonitors.yaml
set:
  prometheus.enabled: true
tests:
  - it: should not render when no additional monitors are configured
    asserts:
      - hasDocuments:
          count: 0

  - it: should preserve list names as strings and monitor fields
    set:
      prometheus.additionalPodMonitors:
        - name: "true"
          selector:
            matchLabels:
              app: api
          podMetricsEndpoints:
            - port: metrics
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: List
      - lengthEqual:
          path: items
          count: 1
      - equal:
          path: items[0].metadata.name
          value: "true"
      - equal:
          path: items[0].spec
          value:
            selector:
              matchLabels:
                app: api
            podMetricsEndpoints:
              - port: metrics

  - it: should remove a map entry set to null in an overlay
    values:
      - fixtures/additional-monitors-base.values
      - fixtures/additional-monitors-remove.values
    asserts:
      - lengthEqual:
          path: items
          count: 1
      - equal:
          path: items[0].metadata.name
          value: api
      - equal:
          path: items[0].spec
          value:
            jobLabel: app
            selector:
              matchLabels:
                app: api
            podMetricsEndpoints:
              - port: http

  - it: should render an empty List when all map entries are removed
    values:
      - fixtures/additional-monitors-base.values
      - fixtures/additional-monitors-remove.values
    set:
      prometheus.additionalPodMonitors.api: null
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: List
      - equal:
          path: items
          value: []

  - it: should use map keys as names unless an explicit name is set
    set:
      prometheus.additionalPodMonitors:
        api:
          selector: {}
          podMetricsEndpoints:
            - port: metrics
        worker:
          name: custom-worker
          selector: {}
          podMetricsEndpoints:
            - port: metrics
    asserts:
      - lengthEqual:
          path: items
          count: 2
      - equal:
          path: items[0].metadata.name
          value: api
      - equal:
          path: items[1].metadata.name
          value: custom-worker

  - it: should keep scalar-looking map keys as string names
    set:
      prometheus.additionalPodMonitors:
        "123":
          selector: {}
          podMetricsEndpoints:
            - port: metrics
        "null":
          selector: {}
          podMetricsEndpoints:
            - port: metrics
        "true":
          selector: {}
          podMetricsEndpoints:
            - port: metrics
    asserts:
      - lengthEqual:
          path: items
          count: 3
      - equal:
          path: items[0].metadata.name
          value: "123"
      - equal:
          path: items[1].metadata.name
          value: "null"
      - equal:
          path: items[2].metadata.name
          value: "true"

  - it: should merge map entries and nested labels across ordered values files
    values:
      - fixtures/additional-monitors-base.values
      - fixtures/additional-monitors-overlay.values
    asserts:
      - lengthEqual:
          path: items
          count: 2
      - equal:
          path: items[0].metadata.name
          value: api
      - equal:
          path: items[0].metadata.labels.team
          value: platform
      - equal:
          path: items[0].metadata.labels.environment
          value: production
      - equal:
          path: items[0].metadata.labels.region
          value: eu
      - equal:
          path: items[0].spec
          value:
            jobLabel: pod-job
            selector:
              matchLabels:
                app: api
            podMetricsEndpoints:
              - port: http
      - equal:
          path: items[1].metadata.name
          value: worker
      - equal:
          path: items[1].spec
          value:
            selector:
              matchLabels:
                app: worker
            podMetricsEndpoints:
              - port: metrics
