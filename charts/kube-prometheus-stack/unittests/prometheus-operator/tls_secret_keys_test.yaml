# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test which keys the operator reads its TLS secret under
templates:
  - prometheus-operator/deployment.yaml
  - prometheus-operator/servicemonitor.yaml
  - prometheus-operator/admission-webhooks/deployment/deployment.yaml
release:
  name: kps
tests:
  - it: should read a user-managed secret as kubernetes.io/tls with the webhook enabled
    set:
      prometheusOperator.tls.secretName: my-operator-tls
    asserts:
      - template: prometheus-operator/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: --web.cert-file=/cert/tls.crt
      - template: prometheus-operator/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: --web.key-file=/cert/tls.key
      - template: prometheus-operator/servicemonitor.yaml
        equal:
          path: spec.endpoints[0].tlsConfig.ca.secret.name
          value: my-operator-tls
      - template: prometheus-operator/servicemonitor.yaml
        equal:
          path: spec.endpoints[0].tlsConfig.ca.secret.key
          value: ca.crt

  - it: should read a user-managed secret as kubernetes.io/tls with the webhook disabled
    set:
      prometheusOperator.admissionWebhooks.enabled: false
      prometheusOperator.tls.secretName: my-operator-tls
    asserts:
      - template: prometheus-operator/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: --web.cert-file=/cert/tls.crt
      - template: prometheus-operator/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: --web.key-file=/cert/tls.key
      - template: prometheus-operator/servicemonitor.yaml
        equal:
          path: spec.endpoints[0].tlsConfig.ca.secret.name
          value: my-operator-tls
      - template: prometheus-operator/servicemonitor.yaml
        equal:
          path: spec.endpoints[0].tlsConfig.ca.secret.key
          value: ca.crt

  - it: should read a user-managed secret as kubernetes.io/tls with the patch job disabled
    set:
      prometheusOperator.admissionWebhooks.patch.enabled: false
      prometheusOperator.tls.secretName: my-operator-tls
    asserts:
      - template: prometheus-operator/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: --web.cert-file=/cert/tls.crt
      - template: prometheus-operator/servicemonitor.yaml
        equal:
          path: spec.endpoints[0].tlsConfig.ca.secret.key
          value: ca.crt

  - it: should read a user-managed secret as kubernetes.io/tls even when the patch job would use Opaque
    set:
      prometheusOperator.admissionWebhooks.patch.secretType: Opaque
      prometheusOperator.tls.secretName: my-operator-tls
    asserts:
      - template: prometheus-operator/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: --web.cert-file=/cert/tls.crt
      - template: prometheus-operator/servicemonitor.yaml
        equal:
          path: spec.endpoints[0].tlsConfig.ca.secret.key
          value: ca.crt

  - it: should read the admission secret as kubernetes.io/tls by default
    asserts:
      - template: prometheus-operator/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: --web.cert-file=/cert/tls.crt
      - template: prometheus-operator/servicemonitor.yaml
        equal:
          path: spec.endpoints[0].tlsConfig.ca.secret.name
          value: kps-kube-prometheus-stack-admission
      - template: prometheus-operator/servicemonitor.yaml
        equal:
          path: spec.endpoints[0].tlsConfig.ca.secret.key
          value: ca.crt

  - it: should read the admission secret under the plain keys when the patch job creates it Opaque
    set:
      prometheusOperator.admissionWebhooks.patch.secretType: Opaque
    asserts:
      - template: prometheus-operator/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: --web.cert-file=/cert/cert
      - template: prometheus-operator/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: --web.key-file=/cert/key
      - template: prometheus-operator/servicemonitor.yaml
        equal:
          path: spec.endpoints[0].tlsConfig.ca.secret.key
          value: ca

  - it: should read the cert-manager secret as kubernetes.io/tls
    set:
      prometheusOperator.admissionWebhooks.enabled: false
      prometheusOperator.admissionWebhooks.certManager.enabled: true
    asserts:
      - template: prometheus-operator/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: --web.cert-file=/cert/tls.crt
      - template: prometheus-operator/servicemonitor.yaml
        equal:
          path: spec.endpoints[0].tlsConfig.ca.secret.key
          value: ca.crt

  - it: should leave the webhook deployment reading the admission secret it actually mounts
    set:
      prometheusOperator.admissionWebhooks.deployment.enabled: true
      prometheusOperator.admissionWebhooks.deployment.tls.enabled: true
      prometheusOperator.admissionWebhooks.patch.secretType: Opaque
      prometheusOperator.tls.secretName: my-operator-tls
    asserts:
      # the webhook mounts <fullname>-admission, never tls.secretName, so naming an operator
      # secret must not change which keys it reads
      - template: prometheus-operator/admission-webhooks/deployment/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: "--web.cert-file=/cert/cert"
      - template: prometheus-operator/admission-webhooks/deployment/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: "--web.key-file=/cert/key"
      - template: prometheus-operator/admission-webhooks/deployment/deployment.yaml
        contains:
          path: spec.template.spec.volumes
          content:
            name: tls-secret
            secret:
              defaultMode: 420
              secretName: kps-kube-prometheus-stack-admission
