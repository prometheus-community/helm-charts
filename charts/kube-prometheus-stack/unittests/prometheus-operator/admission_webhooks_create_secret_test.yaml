suite: admission webhooks create secret job
templates:
  - prometheus-operator/admission-webhooks/job-patch/job-createSecret.yaml
  - prometheus-operator/admission-webhooks/job-patch/role.yaml
tests:
  - it: creates a kubernetes.io/tls secret
    template: prometheus-operator/admission-webhooks/job-patch/job-createSecret.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --secret-type=kubernetes.io/tls

  - it: does not pass --secret-type without secretType
    template: prometheus-operator/admission-webhooks/job-patch/job-createSecret.yaml
    set:
      prometheusOperator.admissionWebhooks.patch.secretType: ""
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[*]
          pattern: ^--secret-type

  - it: allows deleting only the admission secret to migrate it to kubernetes.io/tls
    template: prometheus-operator/admission-webhooks/job-patch/role.yaml
    release:
      name: kps
    asserts:
      - equal:
          path: rules[0].verbs
          value:
            - get
            - create
      - equal:
          path: rules[1]
          value:
            apiGroups:
              - ""
            resources:
              - secrets
            resourceNames:
              - kps-kube-prometheus-stack-admission
            verbs:
              - delete

  - it: does not allow deleting the secret without secretType
    template: prometheus-operator/admission-webhooks/job-patch/role.yaml
    set:
      prometheusOperator.admissionWebhooks.patch.secretType: ""
    asserts:
      - lengthEqual:
          path: rules
          count: 1
      - equal:
          path: rules[0].verbs
          value:
            - get
            - create
