suite: test prometheus-operator deployment
templates:
  - prometheus-operator/deployment.yaml
tests:
  - it: should not render --feature-gates by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --feature-gates

  - it: should render --feature-gates as sorted comma-joined key=value pairs
    set:
      prometheusOperator.featureGates:
        StatusForConfigurationResources: true
        PrometheusAgentDaemonSet: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --feature-gates=PrometheusAgentDaemonSet=true,StatusForConfigurationResources=true

  - it: should render a disabled feature gate as false
    set:
      prometheusOperator.featureGates:
        PrometheusAgentDaemonSet: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --feature-gates=PrometheusAgentDaemonSet=false

  - it: should read the certificate from the kubernetes.io/tls keys of the certgen secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --web.cert-file=/cert/tls.crt
      - contains:
          path: spec.template.spec.containers[0].args
          content: --web.key-file=/cert/tls.key

  - it: should read the certificate from the kubernetes.io/tls keys of the cert-manager secret
    set:
      prometheusOperator.admissionWebhooks.certManager.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --web.cert-file=/cert/tls.crt
      - contains:
          path: spec.template.spec.containers[0].args
          content: --web.key-file=/cert/tls.key

  - it: should keep reading cert and key of the certgen secret without secretType
    set:
      prometheusOperator.admissionWebhooks.patch.secretType: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --web.cert-file=/cert/cert
      - contains:
          path: spec.template.spec.containers[0].args
          content: --web.key-file=/cert/key

  - it: should keep reading cert and key of a self-managed secret if the certgen job is disabled
    set:
      prometheusOperator.admissionWebhooks.patch.enabled: false
      prometheusOperator.tls.secretName: my-operator-tls
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --web.cert-file=/cert/cert
      - contains:
          path: spec.template.spec.containers[0].args
          content: --web.key-file=/cert/key

  - it: should keep reading cert and key of a self-managed secret if admission webhooks are disabled
    set:
      prometheusOperator.admissionWebhooks.enabled: false
      prometheusOperator.tls.secretName: my-operator-tls
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --web.cert-file=/cert/cert
      - contains:
          path: spec.template.spec.containers[0].args
          content: --web.key-file=/cert/key
