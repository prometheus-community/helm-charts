suite: test thanos ruler service account
templates:
  - thanos-ruler/serviceaccount.yaml
tests:
  - it: should not mount a service account token by default
    set:
      thanosRuler.enabled: true
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: should mount a service account token when enabled
    set:
      thanosRuler.enabled: true
      thanosRuler.serviceAccount.automountServiceAccountToken: true
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: should leave the field unset when null
    set:
      thanosRuler.enabled: true
      thanosRuler.serviceAccount.automountServiceAccountToken: null
    asserts:
      - notExists:
          path: automountServiceAccountToken
