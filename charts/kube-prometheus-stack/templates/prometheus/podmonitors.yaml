{{- if and .Values.prometheus.enabled .Values.prometheus.additionalPodMonitors }}
{{- $isMap := kindIs "map" .Values.prometheus.additionalPodMonitors }}
{{- $hasMonitors := false }}
apiVersion: v1
kind: List
items:
{{- range $key, $monitor := .Values.prometheus.additionalPodMonitors }}
{{- if $monitor }}
{{- $hasMonitors = true }}
  - apiVersion: monitoring.coreos.com/v1
    kind: PodMonitor
    metadata:
      {{- if $isMap }}
      name: {{ $monitor.name | default $key | quote }}
      {{- else }}
      name: {{ .name | quote }}
      {{- end }}
      namespace: {{ template "kube-prometheus-stack.namespace" $ }}
      labels:
        app: {{ template "kube-prometheus-stack.name" $ }}-prometheus
{{ include "kube-prometheus-stack.labels" $ | indent 8 }}
        {{- if .additionalLabels }}
{{ toYaml .additionalLabels | indent 8 }}
        {{- end }}
    spec:
      {{- with .scrapeClass }}
      scrapeClass: {{ . }}
      {{- end }}
      {{- include "servicemonitor.scrapeLimits" . | nindent 6 }}
      podMetricsEndpoints:
{{ toYaml .podMetricsEndpoints | indent 8 }}
    {{- if .jobLabel }}
      jobLabel: {{ .jobLabel }}
    {{- end }}
    {{- if .namespaceSelector }}
      namespaceSelector:
{{ toYaml .namespaceSelector | indent 8 }}
    {{- end }}
      selector:
{{ toYaml .selector | indent 8 }}
    {{- if .podTargetLabels }}
      podTargetLabels:
{{ toYaml .podTargetLabels | indent 8 }}
    {{- end }}
    {{- if .sampleLimit }}
      sampleLimit: {{ .sampleLimit }}
    {{- end }}
    {{- if .fallbackScrapeProtocol }}
      fallbackScrapeProtocol: {{ .fallbackScrapeProtocol }}
    {{- end }}
    {{- with .attachMetadata }}
      attachMetadata:
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
{{- end }}
{{- if not $hasMonitors }}
  []
{{- end }}
{{- end }}
