alertmanager:
  alertmanagerSpec:
    replicas: 2
  ingress:
    enabled: true
    hosts:
      - "*.example.com"
  route:
    main:
      enabled: true
      hostnames:
        - "*.example.com"
      timeouts:
        request: 120s
        backendRequest: 60s
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: my-header-name
                value: my-new-header-value
      additionalRules:
        - filters:
            - type: RequestHeaderModifier
              requestHeaderModifier:
                set:
                  - name: my-header-name
                    value: my-new-header-value
          matches:
            - path:
                type: PathPrefix
                value: /foo/
  servicePerReplica:
    enabled: true
  routePerReplica:
    main:
      enabled: true
      hostPrefix: alertmanager
      hostDomain: example.com
      parentRefs:
        - name: gateway
      timeouts:
        request: 30s
        backendRequest: 15s
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: my-header-name
                value: my-new-header-value


