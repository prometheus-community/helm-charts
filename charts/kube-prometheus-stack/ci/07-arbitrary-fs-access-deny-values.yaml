## Reject any ServiceMonitor referencing the scraper's filesystem, so the control-plane
## ServiceMonitors are dropped by the operator if they regress to bearerTokenFile / caFile.
prometheus:
  prometheusSpec:
    arbitraryFSAccessThroughSMs:
      deny: true

kubeDns:
  enabled: true

kubeScheduler:
  serviceMonitor:
    resource:
      enabled: true

kubeProxy:
  serviceMonitor:
    https: true
