suite: test deployment
templates:
  - deployment.yaml
  - configmap.yaml
tests:
  - it: should use default revisionHistoryLimit and enableServiceLinks
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.revisionHistoryLimit
          value: 10
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: true

  - it: should override revisionHistoryLimit and enableServiceLinks
    template: deployment.yaml
    set:
      revisionHistoryLimit: 3
      enableServiceLinks: false
    asserts:
      - equal:
          path: spec.revisionHistoryLimit
          value: 3
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
