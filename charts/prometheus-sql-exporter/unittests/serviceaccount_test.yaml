# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test serviceaccount annotations
templates:
  - serviceaccount.yaml
tests:
  - it: should not set annotations by default
    asserts:
      - notExists:
          path: metadata.annotations

  - it: should render multiple annotations under metadata
    set:
      serviceAccount.annotations:
        a.example.com/one: "1"
        a.example.com/two: "2"
    asserts:
      - equal:
          path: metadata.annotations
          value:
            a.example.com/one: "1"
            a.example.com/two: "2"
      - notExists:
          path: a.example.com/two
