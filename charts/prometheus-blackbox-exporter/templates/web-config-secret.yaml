{{- if and (.Values.webConfiguration).config (not (include "prometheus-blackbox-exporter.webConfigurationExistingSecretName" .)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prometheus-blackbox-exporter.webConfigurationSecretName" . }}
  namespace: {{ template "prometheus-blackbox-exporter.namespace" . }}
  labels:
    {{- include "prometheus-blackbox-exporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  web-config.yaml: |
    {{- toYaml .Values.webConfiguration.config | nindent 4 }}
{{- end }}
