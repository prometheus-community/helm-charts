## An Ingress resource can provide name-based virtual hosting and TLS
## termination among other things for CouchDB deployments which are accessed
## from outside the Kubernetes cluster.
## ref: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  annotations: {}
    # kubernetes.io/tls-acme: "true"
  className: ""
  enabled: false
  hosts:
    ## The host property on hosts and tls is passed through helm tpl function.
    ## ref: https://helm.sh/docs/howto/charts_tips_and_tricks/#using-the-tpl-function
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  labels: {}
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

kind: Deployment

# Override Kubernetes version if your distribution does not follow semver v2
kubeVersionOverride: ""

## Lifecycle hooks for the blackbox-exporter container, not set by default
## ref: https://kubernetes.io/docs/concepts/containers/container-lifecycle-hooks/
lifecycle: {}
  # preStop:
  #   exec:
  #     command: ["sleep", "5"]

livenessProbe:
  failureThreshold: 3
  httpGet:
    path: /-/healthy
    port: http

## Override the namespace
##
namespaceOverride: ""

## Network policy for chart
networkPolicy:
  # Limit access only from monitoring namespace
  # Before setting this value to true, the monitoring namespace must exist. Kubernetes automatically sets the kubernetes.io/metadata.name label on all namespaces. The namespace name can be configured via monitoringNamespaceName
  # Network Policy uses label filtering
  allowMonitoringNamespace: false
  # Enable network policy and allow access from anywhere
  enabled: false
  # Rewrite monitoring namespace in network policy (default value monitoring)
  monitoringNamespaceName: "monitoring"

nodeSelector: {}

pod:
  labels: {}

podAnnotations: {}

podDisruptionBudget: {}
  # maxUnavailable: 0

podMonitoring:
  ## Default values that will be used for all PodMonitoring created by `targets`
  ## Following PodMonitoring API specs https://github.com/GoogleCloudPlatform/prometheus-engine/blob/main/doc/api.md#scrapeendpoint
  defaults:
    additionalMetricsRelabels: {}
    interval: 30s
    labels: {}
    module: http_2xx
    scrapeTimeout: 30s

  ## If true, a PodMonitoring CR is created for a google managed prometheus
  ## https://cloud.google.com/stackdriver/docs/managed-prometheus/setup-managed#gmp-pod-monitoring for each target
  ##
  enabled: false

  ## path: HTTP path. Needs to be adjusted, if web.route-prefix is set
  path: "/probe"

  ## scheme: Protocol scheme to use to scrape.
  scheme: http

  ## If true, a PodMonitoring CR is created for google managed prometheus
  ## https://cloud.google.com/stackdriver/docs/managed-prometheus/setup-managed#gmp-pod-monitoring for blackbox-exporter itself
  ##
  selfMonitor:
    additionalMetricsRelabels: {}
    enabled: false
    interval: 30s
    labels: {}
    path: /metrics
    scrapeTimeout: 30s

  targets:
#    - name: example                    # Human readable URL that will appear in Google Managed Prometheus / AlertManager
#      url: http://example.com/healthz  # The URL that blackbox will scrape
#      hostname: example.com            # HTTP probes can accept an additional `hostname` parameter that will set `Host` header and TLS SNI
#      labels: {}                       # Map of labels for PodMonitoring. Overrides value set in `defaults`
#      interval: 60s                    # Scraping interval. Overrides value set in `defaults`
#      scrapeTimeout: 60s               # Scrape timeout. Overrides value set in `defaults`
#      module: http_2xx                 # Module used for scraping. Overrides value set in `defaults`
#      additionalMetricsRelabels: {}    # Map of metric labels and values to add

  ## tlsConfig: TLS configuration to use when scraping the endpoint. For example if using istio mTLS.
  ## Of type: https://github.com/GoogleCloudPlatform/prometheus-engine/blob/main/doc/api.md#tls
  tlsConfig: {}

podSecurityContext: {}
  # fsGroup: 1000
  ## Preferred way to enable ICMP probes, keeping all capabilities dropped: the exporter first
  ## tries an unprivileged ICMP ("ping") socket, which the kernel allows when the process GID is
  ## within the pod's net.ipv4.ping_group_range. Kubernetes treats this namespaced sysctl as safe,
  ## so it is allowed by default. It cannot be set together with hostNetwork: true.
  ## ICMP modules with `dont_fragment: true` still need a raw socket and therefore NET_RAW.
  ## ref: https://kubernetes.io/docs/tasks/administer-cluster/sysctl-cluster/
  # sysctls:
  #   - name: net.ipv4.ping_group_range
  #     value: "0 2147483647"

priorityClassName: ""

## Prometheus Operator Probe resources, an alternative to `serviceMonitor.targets`.
## One Probe is created per target. Its prober is this chart's Service (port `service.port`).
## ref: https://prometheus-operator.dev/docs/api-reference/api/#monitoring.coreos.com/v1.Probe
probe:
  ## Probe CRD API version
  ##
  apiVersion: monitoring.coreos.com/v1

  # Default values that will be used for all Probes created by `targets`
  defaults:
    additionalMetricsRelabels: {}
    additionalRelabeling: []
    interval: 30s
    ## labels: Probe object labels, for example to match the Prometheus `probeSelector`
    labels: {}
    module: http_2xx
    scrapeTimeout: 30s

  ## If true, a Probe is created for a prometheus operator for each target
  ##
  enabled: false

  ## path: HTTP path of the probe endpoint. Needs to be adjusted, if web.route-prefix is set
  path: "/probe"

  ## scheme: HTTP scheme Prometheus uses to reach the blackbox exporter. Can be used with `tlsConfig`.
  scheme: http

  targets:
#    - name: example                    # Human readable name, set as the `target` label
#      url: http://example.com/healthz  # The URL that blackbox will probe
#      urls: []                         # Additional URLs probed by the same Probe (all get the same `target` label)
#      hostname: example.com            # HTTP probes can accept an additional `hostname` parameter that will set `Host` header and TLS SNI
#      labels: {}                       # Map of labels for the Probe. Overrides value set in `defaults`
#      interval: 60s                    # Probing interval. Overrides value set in `defaults`
#      scrapeTimeout: 60s               # Scrape timeout. Overrides value set in `defaults`
#      module: http_2xx                 # Module used for probing. Overrides value set in `defaults`
#      additionalMetricsRelabels: {}    # Map of metric labels and values to add
#      additionalRelabeling: []         # List of relabeling actions to run on the targets before probing

  ## tlsConfig: TLS configuration to use when scraping the blackbox exporter.
  ## Of type: https://prometheus-operator.dev/docs/api-reference/api/#monitoring.coreos.com/v1.SafeTLSConfig
  tlsConfig: {}

## Custom PrometheusRules to be defined
## ref: https://github.com/coreos/prometheus-operator#customresourcedefinitions
prometheusRule:
  additionalLabels: {}
  enabled: false
  namespace: ""
  rules: []

readinessProbe:
  httpGet:
    path: /-/healthy
    port: http

## set to true to add the release label so scraping of the servicemonitor with kube-prometheus-stack works out of the box
releaseLabel: false

replicas: 1

resources: {}
  # limits:
  #   memory: 300Mi
  # requests:
  #   memory: 50Mi

restartPolicy: Always

## Number of replicasets to retain ##
## default value is 10, 0 will not retain any replicasets and make rollbacks impossible ##
revisionHistoryLimit: 10

## A HTTPRoute (Gateway API) resource is an alternative to Ingress for routing
## external HTTP traffic to the blackbox exporter Service.
## ref: https://gateway-api.sigs.k8s.io/reference/api-types/httproute/
route:
  main:
    ## additionalRules (templated) allows adding custom rules to the route
    additionalRules: []

    ## Annotations to attach to the HTTPRoute resource
    annotations: {}

    ## ApiVersion set by default to "gateway.networking.k8s.io/v1"
    apiVersion: ""

    ## Enable this route
    enabled: false

    ## Filters define the filters that are applied to requests that match
    ## this rule
    filters: []

    ## Hostnames (templated) defines a set of hostnames that should match against the HTTP Host
    ## header to select a HTTPRoute used to process the request
    hostnames: []
      # - my.example.com

    ## httpsRedirect adds a filter for redirecting to https (HTTP 301 Moved Permanently).
    ## To redirect HTTP traffic to HTTPS, you need to have a Gateway with both HTTP and HTTPS listeners.
    ## Matches and filters do not take effect if enabled.
    ## Ref. https://gateway-api.sigs.k8s.io/guides/http-redirect-rewrite/
    httpsRedirect: false

    ## kind set by default to HTTPRoute
    kind: ""

    ## Labels to attach to the HTTPRoute resource
    labels: {}

    ## Matches define conditions used for matching the rule against incoming
    ## HTTP requests
    matches:
      - path:
          type: PathPrefix
          value: /

    ## Optional name for the default rule in the rendered HTTPRoute.
    name: ""

    ## ParentRefs refers to resources this HTTPRoute is to be attached to (Gateways)
    parentRefs: []
      # - name: contour
      #   sectionName: http

# Annotations for the Secret
secretAnnotations: {}

# Store the configuration as a `Secret` instead of a `ConfigMap`, useful in case it contains sensitive data
secretConfig: false

## User and Group to run blackbox-exporter container as
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    # To enable ICMP, prefer the net.ipv4.ping_group_range sysctl in podSecurityContext above.
    # Add NET_RAW only when that sysctl cannot be used (hostNetwork: true) or for `dont_fragment: true`.
    # For a non-root runAsUser the added capability is not effective on its own, see the README.
    # add: ["NET_RAW"]
    drop: ["ALL"]
  readOnlyRootFilesystem: true
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

service:
  annotations: {}
  ipDualStack:
    enabled: false
    ipFamilies: ["IPv6", "IPv4"]
    ipFamilyPolicy: "PreferDualStack"
  labels: {}
  port: 9115
  type: ClusterIP

serviceAccount:
  annotations: {}
  # Specifies whether a ServiceAccount should be created
  create: true
  # The name of the ServiceAccount to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

serviceMonitor:
  ## ServiceMonitor CRD API version
  ##
  apiVersion: monitoring.coreos.com/v1

  bearerTokenFile:

  # Default values that will be used for all ServiceMonitors created by `targets`
  defaults:
    additionalMetricsRelabels: {}
    additionalRelabeling: []
    honorTimestamps: true
    interval: 30s
    labels: {}
    module: http_2xx
    scrapeTimeout: 30s

  ## If true, a ServiceMonitor CRD is created for a prometheus operator
  ## https://github.com/coreos/prometheus-operator for each target
  ##
  enabled: false

  ## path: HTTP path. Needs to be adjusted, if web.route-prefix is set
  path: "/probe"

  ## scheme: HTTP scheme to use for scraping. Can be used with `tlsConfig` for example if using istio mTLS.
  ## Set to https when webConfiguration enables TLS.
  scheme: http

  ## If true, a ServiceMonitor CRD is created for a prometheus operator
  ## https://github.com/coreos/prometheus-operator for blackbox-exporter itself
  ##
  selfMonitor:
    additionalMetricsRelabels: {}
    additionalRelabeling: []
    enabled: false
    interval: 30s
    labels: {}
    path: /metrics
    ## Name of the Service port to scrape. Defaults to "http".
    ## port:
    ## Set to https (with tlsConfig) when webConfiguration enables TLS.
    scheme: http
    scrapeTimeout: 30s
    tlsConfig: {}

  targets:
#    - name: example                    # Human readable URL that will appear in Prometheus / AlertManager
#      url: http://example.com/healthz  # The URL that blackbox will scrape
#      hostname: example.com            # HTTP probes can accept an additional `hostname` parameter that will set `Host` header and TLS SNI
#      labels: {}                       # Map of labels for ServiceMonitor. Overrides value set in `defaults`
#      interval: 60s                    # Scraping interval. Overrides value set in `defaults`
#      scrapeTimeout: 60s               # Scrape timeout. Overrides value set in `defaults`
#      module: http_2xx                 # Module used for scraping. Overrides value set in `defaults`
#      additionalMetricsRelabels: {}    # Map of metric labels and values to add
#      additionalRelabeling: []         # List of metric relabeling actions to run

  ## tlsConfig: TLS configuration to use when scraping the endpoint. For example if using istio mTLS.
  ## Of type: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#monitoring.coreos.com/v1.TLSConfig
  tlsConfig: {}

## Startup probe for the blackbox-exporter container, not set by default
## ref: https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/
startupProbe: {}
  # httpGet:
  #   path: /-/healthy
  #   port: http
  # failureThreshold: 30
  # periodSeconds: 2

strategy:
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
  type: RollingUpdate

## Pod termination grace period in seconds. Set to null to leave it out of the pod spec.
terminationGracePeriodSeconds: 30

tolerations: []

## Topology spread constraints rely on node labels to identify the topology domain(s) that each Node is in.
## Ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints/
topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: failure-domain.beta.kubernetes.io/zone
  #   whenUnsatisfiable: DoNotSchedule
  #   labelSelector:
  #     matchLabels:
  #       app.kubernetes.io/instance: jiralert

# Enable vertical pod autoscaler support for prometheus-blackbox-exporter
verticalPodAutoscaler:
  # List of resources that the vertical pod autoscaler can control. Defaults to cpu and memory
  controlledResources: []
  # Specifies which resource values should be controlled: RequestsOnly or RequestsAndLimits.
  # controlledValues: RequestsAndLimits

  enabled: false

  # Define the max allowed resources for the pod
  maxAllowed: {}
  # cpu: 200m
  # memory: 100Mi
  # Define the min allowed resources for the pod
  minAllowed: {}
  # cpu: 200m
  # memory: 100Mi

  # Recommender responsible for generating recommendation for the object.
  # List should be empty (then the default recommender will generate the recommendation)
  # or contain exactly one recommender.
  # recommenders:
  # - name: custom-recommender-performance

  updatePolicy:
    # Specifies minimal number of replicas which need to be alive for VPA Updater to attempt pod eviction
    # minReplicas: 1
    # Specifies whether recommended updates are applied when a Pod is started and whether recommended updates
    # are applied during the life of a Pod. Possible values are "Off", "Initial", "Recreate", and "Auto".
    updateMode: Auto

## Web configuration (TLS and basic authentication) for the exporter's HTTP endpoints, passed
## with --web.config.file. Format: https://prometheus.io/docs/prometheus/latest/configuration/https/
## Disabled while both `config` and `existingSecret.name` are empty.
webConfiguration:
  # Inline web configuration, rendered into a Secret named <fullname>-web-config.
  # When it contains tls_server_config, the liveness/readiness probes switch to HTTPS and the
  # config reloader calls https://127.0.0.1:<containerPort>/-/reload.
  # When it contains basic_auth_users, or a client_auth_type that requires a client certificate,
  # httpGet probes are replaced by tcpSocket probes on the same port, because credentials are
  # never put into the pod spec. configReloader cannot authenticate and is rejected in that case;
  # set configAutoReload.enabled instead.
  # Mount the certificate and key with extraSecretMounts (for example a kubernetes.io/tls Secret).
  config: {}
    # tls_server_config:
    #   cert_file: /etc/blackbox-exporter/tls/tls.crt
    #   key_file: /etc/blackbox-exporter/tls/tls.key
    # basic_auth_users:
    #   # bcrypt hash, for example from: htpasswd -nBC 10 "" | tr -d ':\n'
    #   <username>: <bcrypt-hash>

  # Alternatively, reference an existing Secret that holds the web configuration under the key
  # web-config.yaml (e.g. managed by Sealed Secrets, Vault, ...). The chart cannot inspect it, so
  # httpGet probes are replaced by tcpSocket probes, and configReloader cannot be enabled.
  # Changes to that Secret do not restart the pods; roll them yourself, for example with podAnnotations.
  existingSecret:
    name: ""
