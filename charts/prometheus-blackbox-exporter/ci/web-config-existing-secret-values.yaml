webConfiguration:
  existingSecret:
    name: blackbox-web-config

# Provide the referenced Secret in the same release so ct install can schedule
# the pod. The key must be web-config.yaml.
extraManifests:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: blackbox-web-config
      namespace: '{{ include "prometheus-blackbox-exporter.namespace" . }}'
    type: Opaque
    stringData:
      web-config.yaml: |
        {}
