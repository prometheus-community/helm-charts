myDomain: tpl.com

probe:
  enabled: true
  targets:
  - name: example-tpl
    url: http://example.{{ .Values.myDomain }}/healthz
  - name: example-non-tpl
    url: http://example.non-tpl.com/healthz
    hostname: example.non-tpl.com
    module: http_2xx
    interval: 60s
    labels:
      release: prometheus
