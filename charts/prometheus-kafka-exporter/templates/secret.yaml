{{- if and (.Values.sasl.scram.enabled) (not .Values.sasl.scram.secretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "prometheus-kafka-exporter.fullname" . }}
type: Opaque
data:
  username: "{{ .Values.sasl.scram.username | b64enc }}"
  password: "{{ .Values.sasl.scram.password | b64enc }}"
{{- end }}
{{- if and (eq (include "prometheus-kafka-exporter.oauthbearerMode" .) "url") (not .Values.sasl.oauthbearer.secretName) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "prometheus-kafka-exporter.saslOAuthBearerSecretName" . }}
type: Opaque
data:
  clientId: "{{ .Values.sasl.oauthbearer.clientId | b64enc }}"
  clientSecret: "{{ .Values.sasl.oauthbearer.clientSecret | default "" | b64enc }}"
{{- end }}
