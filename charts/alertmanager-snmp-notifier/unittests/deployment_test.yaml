suite: test deployment
templates:
  - deployment.yaml
tests:
  - it: renders no pod labels, priority class or topology spread constraints by default
    asserts:
      - equal:
          path: spec.template.metadata.labels
          value:
            app.kubernetes.io/name: alertmanager-snmp-notifier
            app.kubernetes.io/instance: RELEASE-NAME
      - notExists:
          path: spec.template.spec.priorityClassName
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: adds podLabels to the pod template without changing the selector
    set:
      podLabels:
        team: monitoring
    asserts:
      - equal:
          path: spec.template.metadata.labels.team
          value: monitoring
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: alertmanager-snmp-notifier
      - notExists:
          path: spec.selector.matchLabels.team

  - it: sets priorityClassName
    set:
      priorityClassName: system-cluster-critical
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: system-cluster-critical

  - it: sets topologySpreadConstraints
    set:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager-snmp-notifier
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: alertmanager-snmp-notifier

  - it: runs as a non-root user with a restricted security context by default
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534

  - it: allows the security contexts to be overridden
    set:
      podSecurityContext: null
      securityContext:
        runAsUser: 1000
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 1000
