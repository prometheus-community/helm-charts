suite: disruption budget API compatibility
templates:
  - pdb.yaml
tests:
  - it: leaves the disruption budget disabled by default
    asserts:
      - hasDocuments:
          count: 0
  - it: uses a supported disruption budget API on Kubernetes 1.16
    set:
      podDisruptionBudget.enabled: true
      podDisruptionBudget.maxUnavailable: 50%
    capabilities:
      majorVersion: 1
      minorVersion: 16
    asserts:
      - isAPIVersion:
          of: policy/v1beta1
      - equal:
          path: spec.maxUnavailable
          value: 50%
      - equal:
          path: spec.selector.matchLabels.release
          value: RELEASE-NAME
  - it: uses a supported disruption budget API on Kubernetes 1.20
    set:
      podDisruptionBudget.enabled: true
      podDisruptionBudget.maxUnavailable: 50%
    capabilities:
      majorVersion: 1
      minorVersion: 20
    asserts:
      - isAPIVersion:
          of: policy/v1beta1
      - equal:
          path: spec.maxUnavailable
          value: 50%
      - equal:
          path: spec.selector.matchLabels.release
          value: RELEASE-NAME
  - it: uses a supported disruption budget API on Kubernetes 1.21
    set:
      podDisruptionBudget.enabled: true
      podDisruptionBudget.maxUnavailable: 50%
    capabilities:
      majorVersion: 1
      minorVersion: 21
    asserts:
      - isAPIVersion:
          of: policy/v1
      - equal:
          path: spec.maxUnavailable
          value: 50%
      - equal:
          path: spec.selector.matchLabels.release
          value: RELEASE-NAME
  - it: uses a supported disruption budget API on Kubernetes 1.25
    set:
      podDisruptionBudget.enabled: true
      podDisruptionBudget.maxUnavailable: 50%
    capabilities:
      majorVersion: 1
      minorVersion: 25
    asserts:
      - isAPIVersion:
          of: policy/v1
      - equal:
          path: spec.maxUnavailable
          value: 50%
      - equal:
          path: spec.selector.matchLabels.release
          value: RELEASE-NAME
  - it: uses a supported disruption budget API on Kubernetes 1.37
    set:
      podDisruptionBudget.enabled: true
      podDisruptionBudget.maxUnavailable: 50%
    capabilities:
      majorVersion: 1
      minorVersion: 37
    asserts:
      - isAPIVersion:
          of: policy/v1
      - equal:
          path: spec.maxUnavailable
          value: 50%
      - equal:
          path: spec.selector.matchLabels.release
          value: RELEASE-NAME
