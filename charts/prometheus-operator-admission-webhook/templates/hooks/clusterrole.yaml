{{- $mutating := .Values.webhooks.enabled.prometheusruleMutate }}
{{- $validating := or .Values.webhooks.enabled.prometheusruleValidate .Values.webhooks.enabled.alertmanagerconfigsValidate }}
{{- if and .Values.jobs.enabled .Values.rbac.create (or $mutating $validating) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name:  {{ include "prometheus-operator-admission-webhook.fullname" . }}-aux
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- with .Values.jobs.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    app: {{ include "prometheus-operator-admission-webhook.fullname" . }}-aux
    {{- include "prometheus-operator-admission-webhook.labels" . | nindent 4 }}
    {{- with .Values.jobs.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
rules:
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      {{- if $validating }}
      - validatingwebhookconfigurations
      {{- end }}
      {{- if $mutating }}
      - mutatingwebhookconfigurations
      {{- end }}
    resourceNames:
      - {{ include "prometheus-operator-admission-webhook.fullname" . }}
    verbs:
      - get
      - update
      - patch
{{- end }}
