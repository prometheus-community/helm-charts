suite: test createSecret job
templates:
  - hooks/job-createSecret.yaml
  - hooks/role.yaml
tests:
  - it: should create a kubernetes.io/tls secret with tls.crt and tls.key
    template: hooks/job-createSecret.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --secret-type=kubernetes.io/tls
      - contains:
          path: spec.template.spec.containers[0].args
          content: --cert-name=tls.crt
      - contains:
          path: spec.template.spec.containers[0].args
          content: --key-name=tls.key

  - it: should not pass --secret-type without secretType
    template: hooks/job-createSecret.yaml
    set:
      jobs.secretType: ""
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --secret-type=kubernetes.io/tls
      - lengthEqual:
          path: spec.template.spec.containers[0].args
          count: 6

  - it: should allow deleting the secret to migrate an existing secret to kubernetes.io/tls
    template: hooks/role.yaml
    asserts:
      - contains:
          path: rules[0].verbs
          content: delete

  - it: should not allow deleting the secret without secretType
    template: hooks/role.yaml
    set:
      jobs.secretType: ""
    asserts:
      - equal:
          path: rules[0].verbs
          value:
            - get
            - create
