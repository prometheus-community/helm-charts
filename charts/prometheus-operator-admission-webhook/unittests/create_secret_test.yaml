suite: test createSecret job
templates:
  - hooks/job-createSecret.yaml
  - hooks/role.yaml
tests:
  - it: should create a kubernetes.io/tls secret with tls.crt and tls.key
    template: hooks/job-createSecret.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --secret-type=kubernetes.io/tls
      - contains:
          path: spec.template.spec.containers[0].args
          content: --cert-name=tls.crt
      - contains:
          path: spec.template.spec.containers[0].args
          content: --key-name=tls.key

  - it: should not pass --secret-type without secretType
    template: hooks/job-createSecret.yaml
    set:
      jobs.secretType: ""
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --secret-type=kubernetes.io/tls
      - lengthEqual:
          path: spec.template.spec.containers[0].args
          count: 6

  - it: should scope get and delete to the admission secret to migrate it to kubernetes.io/tls
    template: hooks/role.yaml
    release:
      name: adm
    asserts:
      - lengthEqual:
          path: rules
          count: 2
      - equal:
          path: rules[0]
          value:
            apiGroups:
              - ""
            resources:
              - secrets
            verbs:
              - create
      - equal:
          path: rules[1]
          value:
            apiGroups:
              - ""
            resources:
              - secrets
            resourceNames:
              - adm-prometheus-operator-admission-webhook
            verbs:
              - get
              - delete

  - it: should not allow deleting the secret without secretType
    template: hooks/role.yaml
    release:
      name: adm
    set:
      jobs.secretType: ""
    asserts:
      - lengthEqual:
          path: rules
          count: 2
      - equal:
          path: rules[0].verbs
          value:
            - create
      - equal:
          path: rules[1]
          value:
            apiGroups:
              - ""
            resources:
              - secrets
            resourceNames:
              - adm-prometheus-operator-admission-webhook
            verbs:
              - get

  - it: should follow fullnameOverride in the secret resourceNames
    template: hooks/role.yaml
    set:
      fullnameOverride: custom
    asserts:
      - equal:
          path: rules[1].resourceNames
          value:
            - custom
