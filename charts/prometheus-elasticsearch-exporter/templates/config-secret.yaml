{{- if and .Values.multiTarget.authModules (not .Values.multiTarget.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "elasticsearch-exporter.multiTarget.secretName" . }}
  namespace: {{ include "prometheus-elasticsearch-exporter.namespace" . }}
  labels:
    {{- include "elasticsearch-exporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.multiTarget.existingSecretKey }}: |
    {{- include "elasticsearch-exporter.multiTarget.config" . | nindent 4 }}
{{- end }}
