{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: {{ .Values.serviceMonitor.apiVersion }}
kind: ServiceMonitor
metadata:
  name: {{ template "elasticsearch-exporter.fullname" . }}
  namespace: {{ .Values.serviceMonitor.namespace | default (include "prometheus-elasticsearch-exporter.namespace" .)  }}
  labels:
    {{- include "elasticsearch-exporter.labels" . | nindent 4 }}
    {{- if .Values.serviceMonitor.labels }}
    {{- toYaml .Values.serviceMonitor.labels | nindent 4 }}
    {{- end }}
spec:
  endpoints:
  - interval: {{ .Values.serviceMonitor.interval }}
    {{- if .Values.serviceMonitor.scrapeTimeout }}
    scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
    {{- end }}
    honorLabels: true
    port: {{ .Values.service.metricsPort.name }}
    path: {{ .Values.web.path }}
    scheme: {{ .Values.serviceMonitor.scheme }}
    {{- if .Values.serviceMonitor.relabelings }}
    relabelings:
    {{- toYaml .Values.serviceMonitor.relabelings | nindent 4 }}
    {{- end }}
    {{- if .Values.serviceMonitor.metricRelabelings }}
    metricRelabelings:
    {{- toYaml .Values.serviceMonitor.metricRelabelings | nindent 4 }}
    {{- end }}
  jobLabel: {{ default .Release.Name .Values.serviceMonitor.jobLabel }}
  selector:
    matchLabels:
      {{- include "elasticsearch-exporter.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ include "prometheus-elasticsearch-exporter.namespace" . }}
{{- if .Values.serviceMonitor.targetLabels }}
  targetLabels:
{{- range .Values.serviceMonitor.targetLabels }}
    - {{ . }}
{{- end }}
{{- end }}
  sampleLimit: {{ .Values.serviceMonitor.sampleLimit }}
{{- end }}
{{- if .Values.serviceMonitor.enabled }}
{{- range .Values.serviceMonitor.targets }}
---
apiVersion: {{ $.Values.serviceMonitor.apiVersion }}
kind: ServiceMonitor
metadata:
  name: {{ template "elasticsearch-exporter.fullname" $ }}-{{ required "serviceMonitor.targets[].name is required" .name }}
  namespace: {{ $.Values.serviceMonitor.namespace | default (include "prometheus-elasticsearch-exporter.namespace" $) }}
  labels:
    {{- include "elasticsearch-exporter.labels" $ | nindent 4 }}
    {{- with (.labels | default $.Values.serviceMonitor.labels) }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  endpoints:
  - interval: {{ .interval | default $.Values.serviceMonitor.interval }}
    {{- with (.scrapeTimeout | default $.Values.serviceMonitor.scrapeTimeout) }}
    scrapeTimeout: {{ . }}
    {{- end }}
    port: {{ $.Values.service.metricsPort.name }}
    path: /probe
    scheme: {{ $.Values.serviceMonitor.scheme }}
    params:
      target:
      - {{ tpl (required "serviceMonitor.targets[].url is required" .url) $ | quote }}
      {{- with .authModule }}
      auth_module:
      - {{ . | quote }}
      {{- end }}
    relabelings:
    - targetLabel: instance
      replacement: {{ tpl .url $ | quote }}
    {{- with (concat (.relabelings | default list) $.Values.serviceMonitor.relabelings) }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with (concat (.metricRelabelings | default list) $.Values.serviceMonitor.metricRelabelings) }}
    metricRelabelings:
    {{- toYaml . | nindent 4 }}
    {{- end }}
  jobLabel: {{ default $.Release.Name $.Values.serviceMonitor.jobLabel }}
  selector:
    matchLabels:
      {{- include "elasticsearch-exporter.selectorLabels" $ | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ include "prometheus-elasticsearch-exporter.namespace" $ }}
  sampleLimit: {{ $.Values.serviceMonitor.sampleLimit }}
{{- end }}
{{- end }}
