## Global settings for all charts in a tree of dependent charts
## This allows to set the same values for the imagePullSecrets, obviating the need
## to set the same values for each chart (and image) separately
global:
  ## Allow either an array of {name: pullSecret} maps (k8s-style), or an array of strings (more common helm-style).
  ##  imagePullSecrets:
  ##  - name: pullSecret1
  ##  - name: pullSecret2
  ##
  ## or
  ##
  ##  imagePullSecrets:
  ##  - pullSecret1
  ##  - pullSecret2
  ##
  ## or a templated value
  ##
  ##    imagePullSecrets:
  ##    - "{{ .Values.templateValue }}"
  ##  templateValue: test

  imagePullSecrets: []
  imageRegistry: ""

# -- Override the namespace
namespaceOverride: ""

## number of exporter instances
##
replicaCount: 1

## Number of old replicasets to retain ##
## The default value is 10, 0 will garbage-collect old replicasets ##
revisionHistoryLimit: 10

## restart policy for all containers
##
restartPolicy: Always

image:
  registry: ""
  repository: quay.io/prometheuscommunity/elasticsearch-exporter
  # if not set appVersion field from Chart.yaml is used
  tag: ""
  pullPolicy: IfNotPresent
  pullSecret: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: "RuntimeDefault"

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Custom DNS configuration to be added to prometheus-elasticsearch-exporter pods
dnsConfig: {}
# nameservers:
#   - 1.2.3.4
# searches:
#   - ns1.svc.cluster-domain.example
#   - my.dns.search.suffix
# options:
#   - name: ndots
#     value: "2"
#   - name: edns0

log:
  format: logfmt
  level: info

resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  # limits:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  timeoutSeconds: 5
  periodSeconds: 5

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 1
  timeoutSeconds: 5
  periodSeconds: 5

# Lifecycle hooks for the exporter container.
# When unset (null), the chart adds a native preStop sleep of 20 seconds on Kubernetes >= 1.30, so the Pod is
# removed from the Service endpoints before the exporter stops, and no hook on older clusters.
# Set to {} to disable the hook, or to a full lifecycle spec to replace it.
# lifecycle:
#   preStop:
#     sleep:
#       seconds: 10
lifecycle: null

# Example of a more complex liveness probe:
# livenessProbe:
#   exec:
#     command:
#       - /bin/sh
#       - -c
#       - |
#         #!/bin/sh
#         # 1. Check if the exporter itself is alive
#         if ! wget -qO- http://localhost:9108/healthz > /dev/null; then
#           exit 1
#         fi
#
#         # 2. Check if the credentials are still valid by hitting ES directly
#         AUTH=$(printf "%s:%s" "$ES_USERNAME" "$ES_PASSWORD" | base64 | tr -d '\n')
#         ES_URI="http://elasticsearch-es-http.elastic-stack.svc:9200"
#         if ! wget --spider --quiet --header "Authorization: Basic $AUTH" "$ES_URI"; then
#            exit 1
#         fi
#   initialDelaySeconds: 60
#   periodSeconds: 60
#   timeoutSeconds: 10
#   failureThreshold: 3

priorityClassName: ""

nodeSelector: {}

tolerations: []

podAnnotations: {}

podLabels: {}

## Labels to attach to all resources
commonLabels: {}

affinity: {}

## Topology spread constraints rely on node labels to identify the topology domain(s) that each Node is in.
## Ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints/
topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: failure-domain.beta.kubernetes.io/zone
  #   whenUnsatisfiable: DoNotSchedule
  #   labelSelector:
  #     matchLabels:
  #       app.kubernetes.io/instance: prometheus-elasticsearch-exporter

initContainers: []

service:
  enabled: true
  type: ClusterIP
  httpPort: 9108
  metricsPort:
    name: http
  annotations: {}
  labels: {}

deployment:
  annotations: {}
  labels: {}
  metricsPort:
    name: http

## Extra environment variables that will be passed into the exporter pod
## example:
## env:
##   KEY_1: value1
##   KEY_2: value2
env: {}

## Extra arguments to pass to the container's executable
## example:
# extraArgs:
#   - --es.indices_mappings
extraArgs: []

# Extra manifests to deploy as an array
extraManifests: []
  # - |
  #   apiVersion: v1
  #   kind: ConfigMap
  #   metadata:
  #     name: prometheus-elasticsearch-exporter-extra
  #   data:
  #     extra-data: "value"

## The name of a secret in the same kubernetes namespace which contain values to be added to the environment
## This can be useful for auth tokens, etc
envFromSecret: ""

## A list of environment variables from secret refs that will be passed into the exporter pod
## example:
## This will set ${ES_PASSWORD} to the 'password' key from the 'my-secret' secret
## extraEnvSecrets:
##   ES_PASSWORD:
##     secret: my-secret
##     key: password
extraEnvSecrets: {}

# A list of secrets and their paths to mount inside the pod
# This is useful for mounting certificates for security
secretMounts: []
#  - name: elastic-certs
#    secretName: elastic-certs
#    path: /ssl

# A list of additional Volume to add to the deployment
# this is useful if the volume you need is not a secret (csi volume etc.)
extraVolumes: []
#  - name: csi-volume
#    csi:
#      driver: secrets-store.csi.k8s.io
#      readOnly: true
#      volumeAttributes:
#        secretProviderClass: my-spc

#  A list of additional VolumeMounts to add to the deployment
#  this is useful for mounting any other needed resource into
#  the elasticsearch-exporter pod
extraVolumeMounts: []
#  - name: csi-volume
#    mountPath: /csi/volume
#    readOnly: true

es:
  ## Address (host and port) of the Elasticsearch node we should connect to.
  ## This could be a local node (localhost:9200, for instance), or the address
  ## of a remote Elasticsearch server. When basic auth is needed,
  ## specify as: <proto>://<user>:<password>@<host>:<port>. e.g., http://admin:pass@localhost:9200.
  ##
  uri: http://localhost:9200

  ## If true, query stats for all nodes in the cluster, rather than just the
  ## node we connect to.
  ##
  all: true

  ## If true, query stats for all indices in the cluster.
  ##
  indices: true

  ## If true, query settings stats for all indices in the cluster.
  ##
  indices_settings: true

  ## If true, query mapping stats for all indices in the cluster.
  ##
  indices_mappings: true

  ## If true, query stats for aliases.
  ##
  aliases: false

  ## If true, query stats for shards in the cluster.
  ##
  shards: true

  ## If true, query stats for snapshots in the cluster.
  ##
  snapshots: true

  ## If true, query stats for cluster settings.
  ##
  cluster_settings: false

  ## If true, query stats for SLM snapshots.
  ##
  slm: false

  ## If true, query stats for data streams.
  ##
  data_stream: false

  ## If true, query stats for Index Lifecycle Management.
  ##
  ilm: false

  ## If true, query the health report (requires Elasticsearch 8.7.0 or later).
  ##
  health_report: false

  ## If true, query stats for running tasks, filtered by tasks_actions.
  ##
  tasks: false

  ## Task actions to collect when tasks is true, in the same format as the Task API actions parameter.
  ## Empty uses the exporter default (indices:*).
  ##
  tasks_actions: ""

  ## Name of the node to expose metrics for when all is false. Empty uses the exporter default (_local).
  ##
  node: ""

  ## Interval at which the cluster info (used for the cluster label) is refreshed. Empty uses the exporter default (5m).
  ##
  clusterinfo_interval: ""

  ## Timeout for trying to get stats from Elasticsearch. (ex: 20s)
  ##
  timeout: 30s

  ## Skip SSL verification when connecting to Elasticsearch
  ## (only available if image.tag >= 1.0.4rc1)
  ##
  sslSkipVerify: false

  ssl:
    ## If true, a secure connection to ES cluster is used
    ##
    enabled: false

    ## If true, certs from secretMounts will be need to be referenced instead of certs below
    ##
    useExistingSecrets: false

    ca:
      ## PEM that contains trusted CAs used for setting up secure Elasticsearch connection
      ##
      # pem:

      # Path of ca pem file which should match a secretMount path
      path: /ssl/ca.pem
    client:
      ## if true, client SSL certificate is used for authentication
      ##
      enabled: true

      ## PEM that contains the client cert to connect to Elasticsearch.
      ##
      # pem:

      # Path of client pem file which should match a secretMount path
      pemPath: /ssl/client.pem

      ## Private key for client auth when connecting to Elasticsearch
      ##
      # key:

      # Path of client key file which should match a secretMount path
      keyPath: /ssl/client.key
web:
  ## Path under which to expose metrics.
  ##
  path: /metrics

serviceMonitor:
  ## If true, a ServiceMonitor CRD is created for a prometheus operator
  ## https://github.com/coreos/prometheus-operator
  ##
  enabled: false
  apiVersion: "monitoring.coreos.com/v1"
  namespace: ""
  labels: {}
    # release: kube-prometheus-stack
  interval: 10s
  jobLabel: ""
  scrapeTimeout: 10s
  scheme: http
  relabelings: []
  targetLabels: []
  metricRelabelings: []
  sampleLimit: 0
  ## Multi-target scraping: one extra ServiceMonitor per target, scraping the exporter's /probe endpoint with the
  ## cluster address as the `target` parameter. The `instance` label is set to the target URL.
  ## Requires exporter >= v1.10.0. See multiTarget for auth modules.
  ##
  targets: []
  # - name: prod                      # required, suffix of the ServiceMonitor name
  #   url: https://es-prod:9200       # required, Elasticsearch address passed as `target` (templated)
  #   authModule: prod_basic          # optional, an auth module from multiTarget.authModules
  #   interval: 30s                   # optional, defaults to serviceMonitor.interval
  #   scrapeTimeout: 25s              # optional, defaults to serviceMonitor.scrapeTimeout
  #   labels: {}                      # optional, replaces serviceMonitor.labels for this ServiceMonitor
  #   relabelings: []                 # optional, prepended to serviceMonitor.relabelings
  #   metricRelabelings: []           # optional, prepended to serviceMonitor.metricRelabelings

podMonitor:
  ## If true, a PodMonitor CRD is created for a Prometheus Operator
  ## https://prometheus-operator.dev/docs/operator/api/#monitoring.coreos.com/v1.PodMonitor
  ##
  enabled: false
  apiVersion: "monitoring.coreos.com/v1"
  namespace: ""
  labels: {}
  interval: 60s
  scrapeTimeout: 10s
  honorLabels: true
  scheme: http
  relabelings: []
  metricRelabelings: []

prometheusRule:
  ## If true, a PrometheusRule CRD is created for a prometheus operator
  ## https://github.com/coreos/prometheus-operator
  ##
  ## The rules will be processed as Helm template, allowing to set variables in them.
  enabled: false
  namespace: ""
  labels: {}
  rules: []
    # - record: elasticsearch_filesystem_data_used_percent
    #   expr: |
    #     100 * (elasticsearch_filesystem_data_size_bytes{service="{{ template "elasticsearch-exporter.fullname" . }}"} - elasticsearch_filesystem_data_free_bytes{service="{{ template "elasticsearch-exporter.fullname" . }}"})
    #     / elasticsearch_filesystem_data_size_bytes{service="{{ template "elasticsearch-exporter.fullname" . }}"}
    # - record: elasticsearch_filesystem_data_free_percent
    #   expr: 100 - elasticsearch_filesystem_data_used_percent{service="{{ template "elasticsearch-exporter.fullname" . }}"}
    # - alert: ElasticsearchTooFewNodesRunning
    #   expr: elasticsearch_cluster_health_number_of_nodes{service="{{ template "elasticsearch-exporter.fullname" . }}"} < 3
    #   for: 5m
    #   labels:
    #     severity: critical
    #   annotations:
    #     description: There are only {{ "{{ $value }}" }} < 3 ElasticSearch nodes running
    #     summary: ElasticSearch running on less than 3 nodes
    # - alert: ElasticsearchHeapTooHigh
    #   expr: |
    #     elasticsearch_jvm_memory_used_bytes{service="{{ template "elasticsearch-exporter.fullname" . }}", area="heap"} / elasticsearch_jvm_memory_max_bytes{service="{{ template "elasticsearch-exporter.fullname" . }}", area="heap"}
    #     > 0.9
    #   for: 15m
    #   labels:
    #     severity: critical
    #   annotations:
    #     description: The heap usage is over 90% for 15m
    #     summary: ElasticSearch node {{ "{{ $labels.node }}" }} heap usage is high

# Create a service account
# To use a service account not handled by the chart, set the name here
# and set create to false
serviceAccount:
  create: false
  name: default
  # Whether to mount a service account token into the exporter Pod. The exporter does not call the
  # Kubernetes API, so no token is mounted by default. Applies to the Pod and, when create is true,
  # to the ServiceAccount.
  automountServiceAccountToken: false
  annotations: {}

## Multi-target scraping through the exporter's /probe endpoint (exporter >= v1.10.0).
## A single exporter scrapes many clusters: Prometheus passes the cluster address as the `target` parameter and,
## optionally, an `auth_module` defined here. Add the targets under serviceMonitor.targets.
## Set es.uri to "" to run the exporter in multi-target mode only.
## ref: https://github.com/prometheus-community/elasticsearch_exporter#multi-target-scraping-beta
##
multiTarget:
  ## Auth modules rendered into the exporter config file (--config.file). The file is stored in a Secret because
  ## auth modules hold credentials. Supported types: userpass, apikey, aws, tls.
  ##
  authModules: {}
  #  prod_basic:
  #    type: userpass
  #    userpass:
  #      username: metrics
  #      password: s3cr3t
  #  staging_key:
  #    type: apikey
  #    apikey: "bXk6YXBpa2V5Ig=="

  ## Use an existing Secret holding the complete config file instead of authModules (templated).
  ##
  existingSecret: ""

  ## Key of the config file in the Secret.
  ##
  existingSecretKey: config.yml
