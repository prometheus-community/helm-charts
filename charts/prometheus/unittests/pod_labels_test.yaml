suite: test server pod labels
templates:
  - deploy.yaml
tests:
  - it: should not put the chart version in the Deployment pod labels
    asserts:
      - notExists:
          path: spec.template.metadata.labels["helm.sh/chart"]
      - exists:
          path: metadata.labels["helm.sh/chart"]

  - it: should not put the chart version in the StatefulSet pod labels
    set:
      server.statefulSet.enabled: true
    asserts:
      - isKind:
          of: StatefulSet
      - notExists:
          path: spec.template.metadata.labels["helm.sh/chart"]
      - exists:
          path: metadata.labels["helm.sh/chart"]

  - it: should not put the chart version in the DaemonSet pod labels
    set:
      server.daemonSet.enabled: true
      server.persistentVolume.enabled: false
    asserts:
      - isKind:
          of: DaemonSet
      - notExists:
          path: spec.template.metadata.labels["helm.sh/chart"]
      - exists:
          path: metadata.labels["helm.sh/chart"]

  - it: should pin the whole server pod label set
    chart:
      version: 99.99.99
      appVersion: 0.0.0-test
    asserts:
      - equal:
          path: spec.template.metadata.labels
          value:
            app.kubernetes.io/component: server
            app.kubernetes.io/name: prometheus
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/part-of: prometheus
            app.kubernetes.io/version: 0.0.0-test

  - it: should keep the selector labels on the pod template
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/component: server
            app.kubernetes.io/name: prometheus
            app.kubernetes.io/instance: RELEASE-NAME
      - isSubset:
          path: spec.template.metadata.labels
          content:
            app.kubernetes.io/component: server
            app.kubernetes.io/name: prometheus
            app.kubernetes.io/instance: RELEASE-NAME

  - it: should still render commonMetaLabels and server.podLabels on the pod template
    set:
      commonMetaLabels:
        team: platform
      server.podLabels:
        extra: "yes"
    asserts:
      - isSubset:
          path: spec.template.metadata.labels
          content:
            team: platform
            extra: "yes"
      - isSubset:
          path: metadata.labels
          content:
            team: platform
