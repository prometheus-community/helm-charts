auth:
  enabled: true
  redisUser: monitor
  redisPasswordFile:
    secret:
      name: redis-passwords
      key: passwords.json

extraManifests:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: redis-passwords
      namespace: '{{ .Release.Namespace }}'
    type: Opaque
    stringData:
      passwords.json: |
        {"redis://monitor@myredis:6379": "test-password"}
